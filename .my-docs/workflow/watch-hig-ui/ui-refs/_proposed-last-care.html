<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposed — Last care infographic</title>
  <style>
    :root {
      --fg: #1A1A1A;
      --muted: #6B6B6B;
      --accent: #0D9488;
      --surface: rgba(255,255,255,0.75);
      --hairline: rgba(0,0,0,0.08);
      --radius: 8px;
      --secondary: 11px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .watch {
      width: 198px;
      height: 242px;
      padding: 10px 8px 8px;
      background: linear-gradient(180deg, #e0f2fe 0%, #fafafa 50%);
      color: var(--fg);
      border-radius: 40px;
      border: 8px solid #222;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toolbar { display: flex; justify-content: flex-end; }
    .primary {
      padding: 10px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--hairline);
      backdrop-filter: blur(8px);
      text-align: center;
    }
    .primary .k { font-size: 11px; color: var(--muted); font-weight: 600; }
    .primary .v { font-size: 22px; font-weight: 700; color: var(--accent); margin-top: 2px; }
    .primary .h { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .row {
      display: flex; gap: 6px; align-items: center;
      font-size: 11px;
    }
    .row .ic { color: var(--accent); width: 16px; text-align: center; font-size: 12px; }
    .page-dots {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 4px;
    }
    .page-dots i {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(0,0,0,0.25); display: block;
    }
    .page-dots i.on { height: 10px; border-radius: 2px; background: var(--accent); }
  </style>
</head>
<body>
  <div class="watch">
    <div class="toolbar"><span>⚙</span></div>
    <div class="primary">
      <div class="k">Next feed</div>
      <div class="v">1h 20m</div>
      <div class="h">After last bottle</div>
    </div>
    <div class="row"><span class="ic">Fe</span><span>Bottle 120 ml · 2h ago</span></div>
    <div class="row"><span class="ic">Na</span><span>Nap 45m · 3h ago</span></div>
    <div class="row"><span class="ic">Di</span><span>Wet · 1h ago</span></div>
    <div class="page-dots" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i class="on"></i>
    </div>
  </div>
</body>
</html>
