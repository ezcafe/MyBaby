<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposed — Sleep background</title>
  <style>
    :root {
      --fg: #FAFAFA;
      --muted: #A0A0A0;
      --accent: #2DD4BF;
      --accent-fg: #171717;
      --surface: rgba(255,255,255,0.12);
      --radius: 8px;
      --chip-h: 44px;
      --secondary: 11px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .watch {
      width: 198px;
      height: 242px;
      padding: 10px 8px 8px;
      background: linear-gradient(180deg, #1e1b4b 0%, #171717 60%);
      color: var(--fg);
      border-radius: 40px;
      border: 8px solid #222;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .toolbar { display: flex; justify-content: flex-end; }
    .gear { opacity: 0.7; }
    .lead { margin: 0; font-size: 15px; font-weight: 700; }
    .chip {
      min-height: 56px;
      padding: 10px;
      background: var(--accent);
      color: var(--accent-fg);
      border-radius: var(--radius);
    }
    .chip .t { font-size: 15px; font-weight: 700; }
    .chip .s { font-size: var(--secondary); opacity: 0.85; margin-top: 4px; }
    .tip { font-size: var(--secondary); color: var(--muted); }
    .page-dots {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 4px;
    }
    .page-dots i {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.35); display: block;
    }
    .page-dots i.on { height: 10px; border-radius: 2px; background: var(--accent); }
  </style>
</head>
<body>
  <div class="watch">
    <div class="toolbar"><span class="gear">⚙</span></div>
    <p class="lead">Sleep</p>
    <div class="chip">
      <div class="t">Nap</div>
      <div class="s">12:04</div>
    </div>
    <p class="tip">Tap again to stop.</p>
    <div class="page-dots" aria-hidden="true">
      <i></i><i class="on"></i><i></i><i></i><i></i>
    </div>
  </div>
</body>
</html>
