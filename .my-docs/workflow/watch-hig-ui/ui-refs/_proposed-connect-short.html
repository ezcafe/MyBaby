<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposed — Connect short</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --fg: #1A1A1A;
      --muted: #6B6B6B;
      --accent: #0D9488;
      --accent-fg: #FFFFFF;
      --surface: #FFFFFF;
      --hairline: #E5E5E5;
      --radius: 8px;
      --radius-sm: 6px;
      --chip-h: 44px;
      --secondary: 11px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .watch {
      width: 198px;
      height: 242px;
      padding: 12px 10px;
      background: var(--bg);
      color: var(--fg);
      border-radius: 40px;
      border: 8px solid #222;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    h1 { margin: 0; font-size: 15px; text-align: center; }
    .presets { display: flex; gap: 6px; }
    .presets button {
      flex: 1;
      height: var(--chip-h);
      border-radius: var(--radius-sm);
      border: 1px solid var(--hairline);
      background: var(--surface);
      font-size: 11px;
      font-weight: 600;
    }
    .presets button.on {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
    }
    .field {
      height: 36px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 0 8px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }
    .primary {
      height: var(--chip-h);
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 700;
      font-size: 13px;
    }
    details summary {
      font-size: var(--secondary);
      color: var(--muted);
      cursor: pointer;
    }
    details .help {
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="watch">
    <h1>API server</h1>
    <div class="presets">
      <button type="button">Local</button>
      <button type="button" class="on">Production</button>
    </div>
    <div class="field">Pairing code</div>
    <button class="primary" type="button">Save &amp; connect</button>
    <details>
      <summary>Need help?</summary>
      <div class="help">
        1. Web: Settings → Device pairing → Baby Care → Generate code<br />
        2. Pick Production (or Local for simulator)<br />
        3. Enter code → Save &amp; connect<br />
        Advanced: paste token
      </div>
    </details>
  </div>
</body>
</html>
