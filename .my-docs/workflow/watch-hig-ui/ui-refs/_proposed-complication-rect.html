<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposed — Complication rectangular</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .rect {
      width: 162px;
      height: 68px;
      padding: 6px 8px;
      background: #1c1c1e;
      color: #fafafa;
      border-radius: 12px;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .brand {
      font-size: 9px;
      font-weight: 700;
      color: #2DD4BF;
    }
    .primary {
      font-size: 14px;
      font-weight: 700;
    }
    .secondary {
      font-size: 10px;
      color: #A0A0A0;
    }
  </style>
</head>
<body>
  <div class="rect">
    <div class="brand">Baby Care</div>
    <div class="primary">Nap · 12:04</div>
    <div class="secondary">Next feed 1h 20m</div>
  </div>
</body>
</html>
