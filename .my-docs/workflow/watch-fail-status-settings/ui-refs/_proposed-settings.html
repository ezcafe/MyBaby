<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposed — Settings logout</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --fg: #1A1A1A;
      --muted: #6B6B6B;
      --accent: #0D9488;
      --surface: #FFFFFF;
      --hairline: #E5E5E5;
      --danger: #DC2626;
      --radius: 8px;
      --chip-h: 44px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .watch {
      width: 198px;
      height: 242px;
      padding: 12px 10px;
      background: var(--bg);
      color: var(--fg);
      border-radius: 40px;
      border: 8px solid #222;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .host {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }
    .btn {
      height: var(--chip-h);
      border-radius: var(--radius);
      border: 1px solid var(--hairline);
      font-weight: 700;
      font-size: 14px;
      width: 100%;
    }
    .btn.danger {
      background: var(--surface);
      color: var(--danger);
      border-color: var(--danger);
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: auto;
      padding-bottom: 4px;
    }
    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--hairline);
    }
    .dots span.on { background: var(--muted); }
    .caption {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div>
    <div class="watch" aria-label="Settings page — Log out only">
      <div class="header">
        <h1>Settings</h1>
      </div>
      <p class="host">Connected · example.com</p>
      <button type="button" class="btn danger">Log out</button>
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span class="on"></span>
      </div>
    </div>
    <p class="caption">Last page: host + Log out (no Reconnect)</p>
  </div>
</body>
</html>
