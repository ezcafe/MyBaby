<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposed — Connect quick guide</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --fg: #1A1A1A;
      --muted: #6B6B6B;
      --accent: #0D9488;
      --surface: #FFFFFF;
      --hairline: #E5E5E5;
      --radius: 8px;
      --chip-h: 44px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .watch {
      width: 198px;
      height: 242px;
      padding: 10px 10px 8px;
      background: var(--bg);
      color: var(--fg);
      border-radius: 40px;
      border: 8px solid #222;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
    .host {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }
    .guide {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.35;
      margin: 0;
      margin-top: auto;
      padding: 6px 8px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
    }
    .guide strong { color: var(--fg); font-weight: 600; }
    .guide ol {
      margin: 4px 0 0;
      padding-left: 16px;
    }
    .guide li { margin: 2px 0; }
    .presets {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .presets button {
      font-size: 10px;
      padding: 4px 8px;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      background: var(--surface);
    }
    input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      background: var(--surface);
    }
    .primary {
      height: var(--chip-h);
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      width: 100%;
    }
    .caption {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      max-width: 240px;
    }
  </style>
</head>
<body>
  <div>
    <div class="watch" aria-label="Connect page — quick guide at bottom">
      <h1>API server</h1>
      <p class="host">example.com</p>
      <div class="presets">
        <button type="button">Local</button>
        <button type="button">Production</button>
      </div>
      <input type="text" placeholder="Pairing code" aria-label="Pairing code" />
      <button type="button" class="primary">Save &amp; connect</button>
      <div class="guide">
        <strong>Quick connect</strong>
        <ol>
          <li>On web: Settings → Device pairing → Baby Care → Generate code</li>
          <li>Pick Production (or Local for simulator)</li>
          <li>Enter code → Save &amp; connect</li>
        </ol>
      </div>
    </div>
    <p class="caption">Connect controls first; Quick connect guide at bottom of page.</p>
  </div>
</body>
</html>
