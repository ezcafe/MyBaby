<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposed — Connect presets</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --fg: #1A1A1A;
      --muted: #6B6B6B;
      --accent: #0D9488;
      --accent-fg: #FFFFFF;
      --surface: #FFFFFF;
      --hairline: #E5E5E5;
      --danger: #DC2626;
      --radius: 8px;
      --radius-sm: 6px;
      --chip-h: 44px;
      --secondary: 11px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .watch {
      width: 198px;
      height: 242px;
      padding: 10px 8px;
      background: var(--bg);
      color: var(--fg);
      border-radius: 40px;
      border: 8px solid #222;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }
    .presets {
      display: flex;
      gap: 6px;
    }
    .presets button {
      flex: 1;
      height: var(--chip-h);
      border-radius: var(--radius-sm);
      border: 1px solid var(--hairline);
      font-size: 12px;
      font-weight: 600;
      background: var(--surface);
      color: var(--fg);
    }
    .presets button.on {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }
    input {
      height: 36px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      font-size: 13px;
      background: var(--surface);
    }
    .err {
      font-size: var(--secondary);
      color: var(--danger);
      text-align: center;
    }
    .primary {
      height: var(--chip-h);
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 700;
      font-size: 13px;
    }
    .guide {
      margin-top: auto;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      font-size: var(--secondary);
      color: var(--muted);
    }
    .guide strong {
      color: var(--fg);
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .caption {
      position: absolute;
      bottom: 12px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: #555;
    }
    .wrap { position: relative; padding-bottom: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="watch" aria-label="Connect — 44pt presets and danger error">
      <h1>API server</h1>
      <div class="presets">
        <button type="button">Local</button>
        <button type="button" class="on">Production</button>
      </div>
      <input type="text" placeholder="https://…" value="" aria-label="URL" />
      <input type="text" placeholder="Pairing code" aria-label="Pairing code" />
      <div class="err">Invalid or expired code — generate a new one on the web</div>
      <button type="button" class="primary">Save &amp; connect</button>
      <div class="guide">
        <strong>Quick connect</strong>
        1. On web: Settings → Device pairing → Baby Care → Generate code
      </div>
    </div>
    <p class="caption">Delta: presets 44px · danger error · guide ≥11px</p>
  </div>
</body>
</html>
